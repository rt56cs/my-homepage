<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldena - HomePage</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05080f; 
            --card-bg: rgba(10, 20, 35, 0.85); 
            --text-main: #cbd5e1;
            --text-muted: #64748b;
            --neon-cyan: #00b4d8; 
            --neon-purple: #7209b7; 
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            transition: background-image 0.5s ease;
        }

        .wallpaper-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            filter: brightness(0.4);
            transition: all 0.5s ease;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .neon-border {
            position: relative;
            background: var(--card-bg);
            border-radius: 20px;
            z-index: 1;
        }
        .neon-border::before {
            content: "";
            position: absolute;
            top: 0px; left: 0px; right: 0px; bottom: 0px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            border-radius: inherit;
            z-index: -2;
            filter: blur(6px);
            opacity: 0.3; 
            transition: all 0.3s ease;
        }
        .neon-border::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            border-radius: inherit;
            z-index: -1;
            padding: 1px; 
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            transition: all 0.3s ease;
        }
        .neon-border:hover::before, .neon-border:focus-within::before { filter: blur(8px); opacity: 0.5; }
        .neon-border:hover::after, .neon-border:focus-within::after { padding: 1.5px; }

        .top-bar { display: flex; justify-content: flex-end; margin-bottom: -10px; }
        .settings-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted); padding: 8px 16px; border-radius: 20px;
            font-size: 13px; cursor: pointer; transition: all 0.3s ease;
        }
        .settings-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }

        .header-section { display: flex; flex-direction: column; align-items: center; margin-top: 10px; margin-bottom: 10px; }
        .avatar {
            width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
            margin-bottom: 16px; border: 2px solid rgba(0, 180, 216, 0.2);
            box-shadow: 0 0 10px rgba(0, 180, 216, 0.1); transition: all 0.3s ease;
        }
        .avatar:hover { box-shadow: 0 0 15px rgba(0, 180, 216, 0.3), 0 0 25px rgba(114, 9, 183, 0.2); transform: scale(1.02); }
        .main-title {
            font-size: 44px; font-weight: 800; letter-spacing: 2px; color: #f8fafc; margin-bottom: 8px;
            text-shadow: 0 0 2px #fff, 0 0 10px rgba(0, 180, 216, 0.4), 0 0 20px rgba(114, 9, 183, 0.3);
            animation: neon-title-pulse 3s infinite alternate;
        }
        @keyframes neon-title-pulse {
            0% { text-shadow: 0 0 2px #fff, 0 0 10px rgba(0, 180, 216, 0.4), 0 0 15px rgba(114, 9, 183, 0.2); }
            100% { text-shadow: 0 0 4px #fff, 0 0 15px rgba(0, 180, 216, 0.6), 0 0 25px rgba(114, 9, 183, 0.4); }
        }
        .subtitle { font-size: 15px; color: var(--text-muted); letter-spacing: 1px; }

        .search-container { display: flex; align-items: center; padding: 0 20px; height: 56px; border-radius: 20px; }
        .search-icon { color: var(--neon-cyan); font-size: 18px; margin-right: 12px; text-shadow: 0 0 5px rgba(0, 180, 216, 0.5); }
        .search-input { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 15px; font-family: var(--font-family); outline: none; }
        .search-input::placeholder { color: #475569; }
        .search-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; padding: 5px; transition: all 0.3s ease; }
        .search-btn:hover { color: var(--neon-cyan); text-shadow: 0 0 5px rgba(0, 180, 216, 0.5); }

        .nav-tabs { display: flex; padding: 6px; gap: 6px; border-radius: 30px; }
        .tab {
            flex: 1; text-align: center; padding: 12px 0; border-radius: 25px;
            font-size: 14px; font-weight: 500; color: var(--text-muted);
            cursor: pointer; transition: all 0.3s ease; position: relative; z-index: 2;
            user-select: none;
        }
        .tab.active {
            background: rgba(0, 180, 216, 0.1); color: #fff;
            box-shadow: inset 0 0 10px rgba(0, 180, 216, 0.15);
        }
        .tab:not(.active):hover { color: #fff; background: rgba(255,255,255,0.03); }

        .card-list { display: flex; flex-direction: column; gap: 16px; position: relative; }
        .category-group { display: none; flex-direction: column; gap: 16px; }
        .category-group.active { display: flex; animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            display: flex; align-items: center; padding: 16px 20px;
            cursor: pointer; text-decoration: none; color: inherit;
            border-radius: 20px; width: 100%;
        }
        .card-icon {
            width: 40px; height: 40px; border-radius: 50%; background: #0f172a;
            display: flex; align-items: center; justify-content: center;
            margin-right: 16px; font-size: 20px; flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05); overflow: hidden;
        }
        .card-icon img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { flex: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; color: #e2e8f0; }
        .card-subtitle { font-size: 12px; color: var(--text-muted); }
        .card-action { color: var(--neon-cyan); font-size: 18px; text-shadow: 0 0 5px rgba(0, 180, 216, 0.5); }

        .divider-text { text-align: center; color: var(--text-muted); font-size: 12px; margin: 10px 0; }

        .widget-box { padding: 24px; display: flex; flex-direction: column; align-items: center; border-radius: 24px; }
        .clock {
            font-size: 36px; font-weight: 600; letter-spacing: 2px; margin-bottom: 20px;
            font-variant-numeric: tabular-nums; color: #e2e8f0;
            text-shadow: 0 0 10px rgba(0, 180, 216, 0.3), 0 0 20px rgba(114, 9, 183, 0.2);
        }
        .date-header {
            width: 100%; background: rgba(0, 180, 216, 0.05); color: var(--neon-cyan);
            text-align: center; padding: 10px 0; border-radius: 20px;
            font-size: 13px; font-weight: 600; margin-bottom: 20px;
            border: 1px solid rgba(0, 180, 216, 0.1); box-shadow: inset 0 0 10px rgba(0, 180, 216, 0.05);
        }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); width: 100%; gap: 8px; text-align: center; font-size: 14px; }
        .cal-header { color: var(--neon-cyan); font-weight: 600; margin-bottom: 8px; }
        .cal-day { padding: 6px 0; border-radius: 50%; color: #64748b; cursor: pointer; transition: all 0.2s; font-size: 13px; }
        .cal-day:hover { background: rgba(255,255,255,0.05); color: #cbd5e1; }
        .cal-day.active {
            background: linear-gradient(135deg, rgba(0,180,216,0.8), rgba(114,9,183,0.8));
            color: #fff; box-shadow: 0 0 10px rgba(0, 180, 216, 0.3); font-weight: bold;
        }
        .cal-day.empty { visibility: hidden; }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 20, 35, 0.95); border: 1px solid rgba(0, 180, 216, 0.3); 
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.1), inset 0 0 10px rgba(0, 180, 216, 0.05);
            border-radius: 12px; padding: 16px 20px; width: 90%; max-width: 560px;
            display: flex; justify-content: space-between; align-items: center;
            animation: slideUp 0.5s ease forwards; z-index: 100;
        }
        @keyframes slideUp { from { bottom: -100px; opacity: 0; } to { bottom: 20px; opacity: 1; } }
        .toast-text { font-size: 13px; color: #cbd5e1; }
        .toast-action { color: var(--neon-cyan); font-size: 13px; font-weight: 600; cursor: pointer; margin-left: 10px; }
        .toast-close { color: var(--text-muted); cursor: pointer; margin-left: 15px; font-size: 18px; line-height: 1; transition: color 0.2s; }
        .toast-close:hover { color: #fff; }

        .settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        .settings-modal.active { display: flex; }
        
        .settings-box {
            width: 90%;
            max-width: 400px;
            padding: 24px;
            border-radius: 20px;
            position: relative;
            animation: scaleIn 0.3s ease;
        }
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .settings-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .settings-title { font-size: 18px; font-weight: 600; color: #fff; }
        .settings-close {
            background: transparent; border: none; color: var(--text-muted);
            font-size: 22px; cursor: pointer; line-height: 1;
        }
        .settings-close:hover { color: #fff; }

        .settings-item { margin-bottom: 16px; }
        .settings-label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; display: block; }
        .settings-input {
            width: 100%; padding: 12px 16px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0; font-size: 14px; outline: none;
            font-family: var(--font-family);
        }
        .settings-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 8px rgba(0, 180, 216, 0.3); }
        .settings-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn {
            flex: 1; padding: 12px 0; border-radius: 12px; font-size: 14px;
            font-weight: 600; cursor: pointer; transition: all 0.3s ease;
            border: none; font-family: var(--font-family);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: #fff; box-shadow: 0 0 15px rgba(0, 180, 216, 0.3);
        }
        .btn-primary:hover { box-shadow: 0 0 20px rgba(0, 180, 216, 0.6); }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    </style>
</head>
<body>

<div class="wallpaper-layer" id="wallpaperLayer"></div>

<div class="container">
    <div class="top-bar">
        <button class="settings-btn" onclick="openSettings()">⚙ 设置</button>
    </div>

    <div class="header-section">
        <img src="https://cdn.luogu.com.cn/upload/usericon/1552471.png" alt="User Avatar" class="avatar">
        <h1 class="main-title">Goldena</h1>
        <p class="subtitle">HomePage</p>
    </div>

    <div class="search-container neon-border">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="在必应中搜索..." onkeypress="handleSearch(event)">
        <button class="search-btn" onclick="performSearch()">↵</button>
    </div>

    <div class="nav-tabs neon-border">
        <div class="tab active" onclick="switchTab('home', this)">Goldena</div>
        <div class="tab" onclick="switchTab('game', this)">Game</div>
        <div class="tab" onclick="switchTab('tool', this)">Tool</div>
    </div>

    <div class="card-list">
        
        <div class="category-group active" data-category="home">
            <a href="https://www.luogu.com.cn/user/1552471" target="_blank" class="card neon-border">
                <div class="card-icon">
                    <img src="https://cdn.luogu.com.cn/upload/usericon/3.png" alt="Luogu Icon">
                </div>
                <div class="card-content">
                    <div class="card-title">洛谷</div>
                    <div class="card-subtitle">Luogu Profile</div>
                </div>
                <div class="card-action" style="color: #10b981; text-shadow: 0 0 5px rgba(16, 185, 129, 0.5);">→</div>
            </a>

            <!-- 修改：GitHub 卡片使用您提供的 SVG 路径 -->
            <a href="https://github.com/rt56cs" target="_blank" class="card neon-border">
                <div class="card-icon" style="background: #24292e;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"></path>
                    </svg>
                </div>
                <div class="card-content">
                    <div class="card-title">GitHub</div>
                    <div class="card-subtitle">rt56cs</div>
                </div>
                <div class="card-action" style="color: #e2e8f0; text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);">→</div>
            </a>
        </div>

        <div class="category-group" data-category="game">
            <a href="https://florr.io" target="_blank" class="card neon-border">
                <div class="card-icon">
                    <img src="https://cdn-1.webcatalog.io/catalog/florr-io/florr-io-icon-filled-256.png?v=1714779939232" alt="Florr Icon">
                </div>
                <div class="card-content">
                    <div class="card-title">Florr</div>
                    <div class="card-subtitle">Game</div>
                </div>
                <div class="card-action" style="color: #e2e8f0; text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);">→</div>
            </a>
        </div>

        <div class="category-group" data-category="tool">
            <a href="https://chat.deepseek.com/" target="_blank" class="card neon-border">
                <div class="card-icon">
                    <img src="https://ts3.tc.mm.bing.net/th/id/OIP-C.iTH2miJeDuDveYxznohe8AHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="DeepSeek Icon">
                </div>
                <div class="card-content">
                    <div class="card-title">DeepSeek</div>
                    <div class="card-subtitle">AI Chat</div>
                </div>
                <div class="card-action" style="color: #4d6bfe; text-shadow: 0 0 5px rgba(77, 107, 254, 0.5);">→</div>
            </a>

            <a href="https://web.chatboxai.app/" target="_blank" class="card neon-border">
                <div class="card-icon">
                    <img src="https://web.chatboxai.app/favicon.ico" alt="Chatbox Icon">
                </div>
                <div class="card-content">
                    <div class="card-title">Chatbox</div>
                    <div class="card-subtitle">AI Client</div>
                </div>
                <div class="card-action" style="color: #10b981; text-shadow: 0 0 5px rgba(16, 185, 129, 0.5);">→</div>
            </a>
        </div>

    </div>

    <div class="divider-text">Goldena Website</div>

    <div class="widget-box neon-border">
        <div class="clock" id="clock">00:00:00</div>
        <div class="date-header" id="date-header">2026年10月9日</div>
        <div class="calendar-grid" id="calendar">
            <div class="cal-header">日</div>
            <div class="cal-header">一</div>
            <div class="cal-header">二</div>
            <div class="cal-header">三</div>
            <div class="cal-header">四</div>
            <div class="cal-header">五</div>
            <div class="cal-header">六</div>
        </div>
    </div>

    <div class="toast">
        <div class="toast-text">请验证你的身份以保持数据同步。</div>
        <div style="display: flex; align-items: center;">
            <span class="toast-action">验证</span>
            <span class="toast-close" onclick="this.parentElement.parentElement.style.display='none'">×</span>
        </div>
    </div>
</div>

<div class="settings-modal" id="settingsModal">
    <div class="settings-box neon-border">
        <div class="settings-header">
            <span class="settings-title">设置</span>
            <button class="settings-close" onclick="closeSettings()">×</button>
        </div>
        
        <div class="settings-item">
            <label class="settings-label">更改壁纸 (填入图片 URL)</label>
            <input type="text" id="wallpaperInput" class="settings-input" placeholder="https://example.com/image.jpg">
        </div>
        
        <div class="settings-actions">
            <button class="btn btn-secondary" onclick="resetWallpaper()">恢复默认</button>
            <button class="btn btn-primary" onclick="applyWallpaper()">应用</button>
        </div>
    </div>
</div>

<script>
    function switchTab(category, element) {
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
        element.classList.add('active');
        document.querySelectorAll('.category-group').forEach(group => {
            if (group.getAttribute('data-category') === category) {
                group.classList.add('active');
            } else {
                group.classList.remove('active');
            }
        });
    }

    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateClock, 1000);
    updateClock(); 

    function generateCalendar() {
        const calendarGrid = document.getElementById('calendar');
        const dateHeader = document.getElementById('date-header');
        const targetDate = new Date(2026, 9, 9); 
        const year = targetDate.getFullYear();
        const month = targetDate.getMonth();
        const today = targetDate.getDate();
        
        dateHeader.textContent = `${year}年${month + 1}月${today}日`;
        
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        for (let i = 0; i < firstDay; i++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'cal-day empty';
            calendarGrid.appendChild(emptyDiv);
        }
        
        for (let i = 1; i <= daysInMonth; i++) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'cal-day';
            dayDiv.textContent = i;
            if (i === today) dayDiv.classList.add('active');
            calendarGrid.appendChild(dayDiv);
        }
    }
    generateCalendar();

    function performSearch() {
        const query = document.getElementById('searchInput').value.trim();
        if (query) {
            window.open(`https://www.bing.com/search?q=${encodeURIComponent(query)}`, '_blank');
            document.getElementById('searchInput').value = '';
        }
    }
    function handleSearch(event) {
        if (event.key === 'Enter') performSearch();
    }

    const settingsModal = document.getElementById('settingsModal');
    const wallpaperLayer = document.getElementById('wallpaperLayer');

    function openSettings() {
        const savedWallpaper = localStorage.getItem('goldenaWallpaper') || '';
        document.getElementById('wallpaperInput').value = savedWallpaper;
        settingsModal.classList.add('active');
    }

    function closeSettings() {
        settingsModal.classList.remove('active');
    }

    function applyWallpaper() {
        const url = document.getElementById('wallpaperInput').value.trim();
        if (url) {
            wallpaperLayer.style.backgroundImage = `url('${url}')`;
            localStorage.setItem('goldenaWallpaper', url);
        } else {
            alert('请输入图片链接！');
        }
        closeSettings();
    }

    function resetWallpaper() {
        wallpaperLayer.style.backgroundImage = 'none';
        localStorage.removeItem('goldenaWallpaper');
        document.getElementById('wallpaperInput').value = '';
        closeSettings();
    }

    window.addEventListener('DOMContentLoaded', () => {
        const savedWallpaper = localStorage.getItem('goldenaWallpaper');
        if (savedWallpaper) {
            wallpaperLayer.style.backgroundImage = `url('${savedWallpaper}')`;
        }
    });
</script>

</body>
</html>
